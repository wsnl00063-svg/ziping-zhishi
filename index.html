 $('monthBasis').innerHTML='<details id="dLayers"><summary>本月证据 · 支持与反证</summary>'+detail(r.month)+detail(r.year)+detail(r.dayun)+'</details><div class="sub" id="jieInfo">本月始于'+esc(c.jie.name+' '+c.jie.time)+'，至'+esc(c.next.name+' '+c.next.time)+'前（北京时间 UTC+8；模型间存在约20秒以内差异，贴近交界宜前后对照）。</div><div class="sub">'+esc(c.stamp)+' 北京时间 UTC+8'+(day?'｜农历'+esc(day.lunar):'')+'</div><div class="tool"><button type="button" id="copyBasis">复制推演供复核</button></div>';
 $('copyMonth').onclick=function(){copy(brief());};$('copyBasis').onclick=function(){copy(brief()+'\n\n'+[r.dayun,r.year,r.month].map(function(x){return x.layer+' '+x.gz+'\n支持：'+x.support.map(function(f){return f.text;}).join('；')+'\n反证：'+x.counter.map(function(f){return f.text;}).join('；')+'\n待辨：'+x.unresolved.join('；');}).join('\n\n')+'\n以上是有限程序推导，请沿原局→大运→流年→流月复核生克制化，不以数量或标签裁决；不预设具体事件，不用命理代替法律、专业规范或客观证据。');};
 $('vBig').innerHTML='<div class="card"><div class="hd">壬午｜乙巳｜壬寅｜乙巳</div>'+rows([['原局底稿',r.natal.dominant+'。'+r.natal.verdict],['大运',E.mainSentence(r.dayun)],['研究取向',D.sourceNote]])+detail(r.dayun)+'<p class="sub">大运戊申：2023—2032，按用户指定，不重算起运。仅研究此本命，不替市场、项目或单位立盘。</p></div>';
 if(view==='day')renderDay();setView(view);
 $('prev').disabled=cur===D.range[0];$('next').disabled=cur===D.range[1];
}
function renderDay(){var r=E.at(getMs(),D.terms,true),d=r.day;
 var causes=d.delta.relations.filter(function(x){return x.a==='流日'||x.b==='流日';}).map(function(x){return x.text;});
 $('vDay').innerHTML='<div class="card" id="dayCard"><div class="hd">'+esc(r.calendar.date+' '+r.calendar.day+'日')+'</div>'+rows([['月势不变',r.month.verdict],['流日观察',d.verdict]])+(d.worthStudy?'<div class="row">触及的条件：'+esc(d.changes.filter(function(x){return ['capacity','source','pressure','drain','waterGather','rootHit','metalClear'].indexOf(x.key)>=0;}).map(function(x){return {capacity:'通根承载',source:'印源有效性',pressure:'财生官杀',drain:'伤食泄耗',waterGather:'水局齐字',rootHit:'水根受冲',metalClear:'印透与合克'}[x.key];}).join('、')||'新增成局关系')+'。这是待研究信号，不是当日吉凶。</div>':'')+'<details id="dailyBasis"><summary>独立查看当日关系（有具体事项再细断）</summary>'+list(causes.length?causes:['无新增合冲关系'])+detail(d)+'</details><details id="hourCalc"><summary>流时排盘（非日常预测）</summary>'+rows([['当前柱',r.calendar.hour],['换日约定',D.dateRule]])+'<div class="sub">只显示干支，不生成宜忌，不用流时压过月势。</div></details><div class="tool"><button type="button" id="copyDay">复制流日观察</button></div></div>';
 $('copyDay').onclick=function(){copy(brief(r)+'\n【流日】'+r.calendar.day+' '+d.verdict+'\n【新增关系】'+causes.join('；'));};
}
function setView(v){view=v;$('vMonth').classList.remove('hide');[['month','monthBasis','bMonth'],['day','vDay','bToday'],['big','vBig','bBig']].forEach(function(x){$(x[1]).classList.toggle('hide',v!==x[0]);$(x[2]).classList.toggle('on',v===x[0]);});if(v!=='month')$('professional').open=true;}

function go(date,v){if(D.days.every(function(d){return d.date!==date;}))throw Error('日期超出原离线范围');cur=date;$('pick').value=cur;if(v)view=v;render();}
$('pick').innerHTML=D.days.map(function(d){return '<option value="'+d.date+'">'+d.date+' 周'+d.weekday+' '+d.day_gz+'</option>';}).join('');
var today=E.stamp(now()).slice(0,10);cur=today<D.range[0]?D.range[0]:today>D.range[1]?D.range[1]:today;
$('clock').value=E.stamp(now()).slice(11,19);
if(cur!==today){$('notice').textContent='今天不在原版离线日期范围 '+D.range.join(' 至 ')+'（北京时间 UTC+8），已选最近日期；不会拿旧卡片冒充今天。';$('notice').style.display='block';}
$('bMonth').onclick=function(){view='month';render();};$('bToday').onclick=function(){view='day';render();};$('bBig').onclick=function(){view='big';render();};
$('pick').onchange=function(){go(this.value);};$('clock').onchange=function(){render();};
function move(n){var i=D.days.map(function(d){return d.date;}).indexOf(cur);if(D.days[i+n])go(D.days[i+n].date);}
$('prev').onclick=function(){move(-1);};$('next').onclick=function(){move(1);};
$('rules').innerHTML=rows([['历法',D.dateRule],['取舍',D.sourceNote],['推演边界','只自动辨有限的季节、根气、财官杀印比食伤路径；交错关系保留待复核，不声称完成专业成格、合化或旺衰全断。'],['调候','原局巳月燥热需要发源润燥，但流月寒暖可改变需求；本模型不自动断精细调候用量，不能把寒暖或金水数量直接当吉凶。'],['现实边界','只作传统文化反思框架，不是经科学验证的预测；执法、医疗、投资等行动以法律、专业规范和客观证据为准。'],['版本','由独立页 ZS-v3.2 演进；旧冻结日卡不再参与判断；未修改六爻、临阵或旧合并页。']]);
var t=D.decision_template;$('decide').innerHTML='<b>'+esc(t.title)+'</b>'+list(t.questions)+'<p class="sub">仅保留事实审查问题；删除旧交易统计与分级日历。页面不保存个人输入，历史日期仍可从日期框查看；旧版也未提供记录保存功能。</p>';
go(cur,'month');
window.ZhishiApp={go:go,view:function(){return view;},cur:function(){return cur;},data:D,result:function(){return result;},brief:function(){return brief();},at:function(ms,withDay){return E.at(ms,D.terms,withDay);}};
})();
