function mechanisms(nodes,mz,g,layer,parent){

 var waterRec=g.roots.filter(function(r){return el(r.g)==='水';});
 var waterBen=summarizeRoots(waterRec.filter(function(r){return r.qi==='本气';}));
 var waterZhong=summarizeRoots(waterRec.filter(function(r){return r.qi==='中气';}));
 var waterYu=summarizeRoots(waterRec.filter(function(r){return r.qi==='余气';}));
 var seals=nodes.filter(function(n){return el(n.g)==='金';});
 var sealRoots=g.roots.filter(function(r){return seals.some(function(n){return n.id===r.stem;});});
 var sealBen=summarizeRoots(sealRoots.filter(function(r){return r.qi==='本气';}));
 var sealZhong=summarizeRoots(sealRoots.filter(function(r){return r.qi==='中气';}));
 var sealYu=summarizeRoots(sealRoots.filter(function(r){return r.qi==='余气';}));
 var cleanBen=sealBen.filter(function(r){return !r.disturbed;});
 var dirtyBen=sealBen.filter(function(r){return r.disturbed;});
 var hiddenRaw=[];
 nodes.forEach(function(n){
  Array.from(n.hidden).forEach(function(h,i){
   if(el(h)!=='金')return;
   var d=disturbOf(n.id,n.z,g);
   hiddenRaw.push({z:n.z,qi:['本气','中气','余气'][i],cang:h,exact:true,disturbed:d.disturbed,clashed:d.clashed,at:n.id});
  });
 });
 var hiddenSeal=summarizeRoots(hiddenRaw);
 var partners=[],seenP={};
 seals.forEach(function(n){
  g.relations.forEach(function(r){
   if(r.kind!=='干合'||(r.a!==n.id&&r.b!==n.id))return;
   var oid=r.a===n.id?r.b:r.a,o=nodes.filter(function(t){return t.id===oid;})[0];
   var name=oid+o.g;
   if(!seenP[name]){seenP[name]=1;partners.push(name);}
  });
 });
 var fireBen=[],seenF={};
 nodes.forEach(function(n){
  if(el(n.g)!=='火')return;
  if(!g.roots.some(function(r){return r.stem===n.id&&r.qi==='本气';}))return;
  if(!seenF[n.g]){seenF[n.g]=1;fireBen.push(n.g+role(n.g));}
 });
 var pressed=fireBen.length>0&&(seals.length>0||hiddenSeal.length>0);
 var hiddenWealth=nodes.some(function(n){return n.z==='巳'||n.z==='午';});
 var earthRoot=nodes.some(function(n){return el(n.g)==='土'&&g.roots.some(function(r){return r.stem===n.id;});});
 var wood=nodes.some(function(n){return el(n.g)==='木';});
 var woodSplit=wood&&earthRoot&&(hiddenWealth||fireBen.length>0);
 var sealShows=[];
 seals.forEach(function(n){var name=n.g+role(n.g);if(sealShows.indexOf(name)<0)sealShows.push(name);});
 var sealPath='none';
 if(!seals.length&&!hiddenSeal.length)sealPath='none';
 else if(!seals.length)sealPath=hiddenSeal.some(function(h){return h.qi==='本气';})?'hidden':'thin';
 else if(!sealBen.length&&!sealZhong.length)sealPath='thin';
 else if(partners.length||pressed||!cleanBen.length||flow!=='金')sealPath='tangled';
 else sealPath='open';
 var sealTag={none:'未见金',thin:'印的根轻，不能当成救应，也不是没有印',hidden:'印未透，藏着的根还在',tangled:'印被合克或未当令牵住，生身的路未断，也没有被勾销',open:'透印有未被占住的本气根，生身较清楚，但印仍克伤官'}[sealPath];
 var waterPlaces=waterBen.concat(waterZhong);
 return {
  birthCommand:'火',flow:flow,
  waterBen:waterBen,waterZhong:waterZhong,waterYu:waterYu,
  sealPath:sealPath,sealTag:sealTag,sealShows:sealShows,sealPartners:partners,
  cleanBen:cleanBen,dirtyBen:dirtyBen,sealYu:sealYu,sealZhong:sealZhong,hiddenSeal:hiddenSeal,
  pressed:pressed,pressShows:fireBen,hiddenWealth:hiddenWealth,woodSplit:woodSplit,
  capacity:flow==='水'&&waterBen.length>0,
  source:false,
  pressure:(fireBen.length>0||flow==='火')&&earthRoot,
  drain:flow==='木',
  waterGather:g.groups.some(function(x){return x.element==='水';}),
  rootHit:waterPlaces.some(function(x){return x.clashed;}),
  metalClear:sealPath==='open'
 };
}
function stemLine(n,m){
 var e=el(n.g);
 if(e==='土')return n.g+role(n.g)+'透出克壬'+(m.woodSplit?'；木能制土，也能生火再生土，制化不专':'');
 if(e==='金')return n.g+role(n.g)+'透出';
 if(e==='水')return n.g+role(n.g)+'透出，单凭透干不能改成身强';
 if(e==='木')return n.g+role(n.g)+'透出，泄身生财，也可能制土';
 if(e==='火')return n.g+role(n.g)+'透出，耗身并生官杀';
 return n.g+role(n.g);
}
function commandLine(n,m){
 if(m.flow==='水')return n.z+'水当令';
 if(m.flow==='木')return n.z+'木当令，泄耗加重';
 if(m.flow==='火')return n.z+'火当令，与出生时的财格同向';
 if(m.flow==='金')return n.z+'金当令';
 if(m.flow==='土')return n.z+'土当令，官杀得令';
 return '';
}
function rootLine(m){
 var parts=[];
 if(m.waterBen.length)parts.push('本气水根是'+m.waterBen.map(function(x){return x.text;}).join('、'));
 if(m.waterZhong.length)parts.push('中气水根是'+m.waterZhong.map(function(x){return x.text;}).join('、')+'，与亥子本气不是一种根');
 if(m.waterYu.length)parts.push('余气水根是'+m.waterYu.map(function(x){return x.text;}).join('、')+'，更轻，不与本气并算');
 if(!m.waterBen.length&&!m.waterZhong.length&&!m.waterYu.length)parts.push('亥、子、申、丑、辰里都没有见到水根');
 if(m.waterBen.concat(m.waterZhong,m.waterYu).some(function(x){return x.disturbed;}))parts.push('受冲、合、刑牵动的根都还在，不拔除');
 return parts.join('；');
}
function sealLine(m){
 var press=m.pressed?(m.pressShows.join('、')+'有本气根，能制金，印还在'):(m.hiddenWealth?'巳午所藏的财能制金，印还在':'');
 if(m.sealPath==='none')return '未见金';
 if(m.sealPath==='hidden'||m.sealPath==='thin'){
  var list=m.hiddenSeal.map(function(x){return x.text;}).join('、');
  return joinSent([(m.sealPath==='thin'?'金只剩下轻根，不能当成救应，也不是没有印：':'印没有透到天干：')+list,press]);
 }
 var bits=[m.sealShows.join('、')+'透出'];
 if(m.sealPartners.length>1)bits.push('与'+m.sealPartners.join('、')+'争合，合而不化');
 else if(m.sealPartners.length===1)bits.push('与'+m.sealPartners[0]+'相合，合而不化');
 if(m.cleanBen.length)bits.push('未被占住的本气根在'+m.cleanBen.map(function(x){return x.text;}).join('、'));
 if(m.dirtyBen.length)bits.push('受牵的本气根在'+m.dirtyBen.map(function(x){return x.text;}).join('、')+'，不拔除');
 if(m.sealZhong.length)bits.push('中气根在'+m.sealZhong.map(function(x){return x.text;}).join('、'));
 if(m.sealYu.length)bits.push('余气根在'+m.sealYu.map(function(x){return x.text;}).join('、')+'，轻于本气');
 var tail=m.sealPath==='open'?'生身的路在未被占住的本气根上较清楚，印仍然克伤官，不因此作吉':'生身的路被牵住，没有断开，也不能当成已经生效；印若去克伤官，生财的路一并受影响';
 return joinSent([bits.join('，'),tail,press]);
}
function stemComb(id,g,nodes){
 var names=[];
 g.relations.forEach(function(r){
  if(r.kind!=='干合'||(r.a!==id&&r.b!==id))return;
  var oid=r.a===id?r.b:r.a,o=nodes.filter(function(t){return t.id===oid;})[0];
  names.push(oid+o.g);
 });
 if(!names.length)return '';
 var self=nodes.filter(function(t){return t.id===id;})[0];
 return self.g+'与'+names.join('、')+(names.length>1?'争合':'相合')+'，合而不化';
}
function place(item){
 if(item.z==='亥'&&item.exact&&item.qi==='本气')return '亥中壬（禄）';
 if(item.z==='子'&&!item.exact&&item.qi==='本气')return '子中癸（刃）';
 if(item.z==='子'&&item.exact&&item.qi==='本气')return '子中癸（禄）';
 if(item.z==='申'&&item.qi==='中气'&&String(item.cang).indexOf('壬')>=0)return '申中壬（长生、中气）';
 if(item.qi==='本气')return item.z+'中'+item.cang+'（本气'+(item.exact?'':'同类')+'）';
 if(item.qi==='余气')return item.z+'中'+item.cang+'（余气）';
 return item.z+'中'+item.cang+'（'+item.qi+'）';
}
function briefRoot(m){
 var b=m.waterBen.map(place),z=m.waterZhong.map(place);
 var tail=(m.waterBen.concat(m.waterZhong,m.waterYu).some(function(x){return x.disturbed;})?'，受牵仍在，不拔除':'');
 if(b.length&&z.length)return b.join('、')+'与'+z.join('、')+'不是一种根'+tail;
 if(z.length&&!b.length)return '水根只在'+z.join('、')+'，不是亥子禄刃'+tail;
 if(b.length)return '本气水根在'+b.join('、')+tail;
 if(m.waterYu.length)return '只见余气水根'+m.waterYu.map(place).join('、')+'，不与本气并算';
 return '未见亥、子或申中的水根';
}
function briefSeal(m){
 var press=m.pressed?(m.pressShows.join('、')+'有根，能制金，印还在'):(m.hiddenWealth?'巳午藏财仍能制金，印还在':'');
 if(m.sealPath==='none')return '未见金';
 if(m.sealPath==='hidden'||m.sealPath==='thin'){
  var hs=m.hiddenSeal.map(place).join('、');
  return (m.sealPath==='thin'?'金印只余轻根，不能当成救应：':'印未透：')+hs+'。'+(press||'藏根还在，见金不即生效');
 }
 var head=m.sealShows.join('、')+'透出';
 var comb=m.sealPartners.length>1?'与'+m.sealPartners.join('、')+'争合，合而不化':(m.sealPartners.length?'与'+m.sealPartners[0]+'相合，合而不化':'');
 var roots=[];
 if(m.cleanBen.length)roots.push(m.cleanBen.map(place).join('、')+'没被占住');
 if(m.dirtyBen.length)roots.push(m.dirtyBen.map(place).join('、')+'受牵不拔');
 if(m.sealYu.length)roots.push('另有余气'+m.sealYu.map(place).join('、'));
 var core=[head,comb,roots.join('，')].filter(Boolean).join('，');
 if(m.sealPath==='open')return core+'。生身较清楚，仍克伤官，不因此作吉。'+press;
 return core+'。'+(press?press+'。':'')+'生身未断，不能当成已经生效，也不因此作吉';
}
function yearLink(g){
 var rel=g.relations.filter(function(r){
  var ids=[r.a,r.b];
  return ids.indexOf('流年')>=0&&ids.indexOf('流月')>=0&&(r.kind==='干合'||r.kind==='冲'||r.kind==='合');
 });
 if(!rel.length)return '';
 return '与流年新起'+uniq(rel.map(function(r){return r.kind;})).join('、')+'（'+uniq(rel.map(function(r){return r.pair;})).join('、')+'），岁柱仍在';
}
function evidence(m){
 var support=[],counter=[],unresolved=[];
 if(m.flow==='水'&&m.waterBen.length)support.push(fact('season_root','流月水令，本气水根在'+m.waterBen.map(function(x){return x.text;}).join('、')+'。只说明承载条件有变'));
 if(m.waterZhong.length)support.push(fact('zhong_root','中气水根另计：'+m.waterZhong.map(function(x){return x.text;}).join('、')));
 if(m.sealPath==='open')support.push(fact('seal_open','透印有未被占住的本气根，生身路径较清楚；它同时克伤官，所以不是吉断'));
 else if(m.sealPath!=='none')support.push(fact('seal_path','印的生身路径还在。'+m.sealTag));
 if(m.pressed)counter.push(fact('press',m.pressShows.join('、')+'透出且有本气根，能制金；印还在'));
 else if(m.hiddenWealth)counter.push(fact('hidden_wealth','巳午藏着财星，能制金；印还在'));
 if(m.sealPartners.length)counter.push(fact('combine',m.sealPartners.join('、')+'与印相合，合而不化，两边的作用都留着'));
 if(m.rootHit)counter.push(fact('root_hit','水根所在的支逢冲。根还在，不把冲写成拔根，也不把冲定成喜忌'));
 if(m.drain)counter.push(fact('drain','木当令，壬水被泄去生财'));
 if(m.flow==='火')counter.push(fact('wealth_season','财的季令与出生财格同向，财旺不是财运好'));
 if(m.woodSplit)unresolved.push('木制土与木生火再生土并存，不能把克身说成已经制住');
 if(m.waterGather)unresolved.push('水的三合或三会已经齐字，未判合化；水多不是吉');
 if(m.sealPath==='tangled')unresolved.push('印透出了，合或财制还在，生身没有成立');
 if(m.sealPath==='hidden'||m.sealPath==='thin')unresolved.push('印没有透成可用的救应');
 return {support:support,counter:counter,unresolved:uniq(unresolved)};
}
function ownRoots(last,m){return m.waterBen.filter(function(r){return r.z===last.z;});}
function parentStrike(last,m,g,parent){
 var prev={};
 if(parent&&parent.mechanisms){(parent.mechanisms.waterBen||[]).concat(parent.mechanisms.waterZhong||[]).forEach(function(r){prev[r.z]=1;});}
 var hit=g.relations.filter(function(r){return r.kind==='冲'&&(r.a===last.id||r.b===last.id);})[0];
 if(!hit)return null;
 var oid=hit.a===last.id?hit.b:hit.a,node=null;
 g.relations.forEach(function(){});
 var nodesGuess=m.waterZhong.concat(m.waterBen).filter(function(r){return hit.pair.indexOf(r.z)>=0&&prev[r.z];});
 if(!nodesGuess.length)return null;
 return {pair:hit.pair,roots:nodesGuess};
}
function sealBlock(m){
 var bits=[];
 if(m.sealPartners.length>1)bits.push('与'+m.sealPartners.join('、')+'争合');
 else if(m.sealPartners.length)bits.push('与'+m.sealPartners[0]+'相合');
 if(m.pressed)bits.push(m.pressShows.join('、')+'有根来制');
 if(m.cleanBen.length)bits.push(m.cleanBen.map(place).join('、')+'还在');
 if(m.dirtyBen.length)bits.push(m.dirtyBen.map(place).join('、')+'受牵');
 if(m.sealYu.length)bits.push('另有余气'+m.sealYu.map(place).join('、'));
 if(!bits.length&&(m.sealPath==='hidden'||m.sealPath==='thin'))bits.push('印没有透出');
 return bits.join('，');
}
function cast(nodes,m){
 var rg=function(name){return nodes.filter(function(n){return role(n.g)===name;});};
 return {guan:rg('正官'),sha:rg('七杀'),shang:rg('伤官'),yin:rg('偏印').concat(rg('正印')),cai:rg('偏财').concat(rg('正财')),
  hidden:m.hiddenSeal||[],ben:m.waterBen||[],zhong:(m.waterZhong||[]).filter(function(r){return r.z==='申';}),
  partners:m.sealPartners||[],pressed:!!m.pressed,press:m.pressShows||[],woodSplit:!!m.woodSplit,path:m.sealPath,clean:m.cleanBen||[]};
}
function sealWords(c){
 var hiddenBen=c.hidden.filter(function(h){return h.qi==='本气';});
 var limit=[];
 if(c.partners.length>1)limit.push('与'+c.partners.join('、')+'争合');
 else if(c.partners.length)limit.push('与'+c.partners[0]+'相合');
 if(c.pressed)limit.push(c.press.join('、')+'来制');
 if(c.yin.length){
  var root=c.path==='open'?'本气根没被占住，生身用得上，同时克伤官':(limit.length?limit.join('，')+'。印还在，只是被牵住，作用打了折扣':'根还在，能生身，力度有限');
  if(c.clean&&c.clean.length)root+='。'+c.clean.map(place).join('、')+'还在';
  return c.yin.map(function(n){return n.g+role(n.g);}).filter(function(x,i,a){return a.indexOf(x)===i;}).join('、')+'透出，'+root;
 }
 if(hiddenBen.length)return '印未透：'+hiddenBen.map(place).join('、')+'藏着，能接土、能生水，作用小于透印，不是没有';
 return '印只见余气，作用轻';
}
function layerRead(layer,last,m,g,parent,nodes){
 var c=cast(nodes,m),e=el(last.g),roots=ownRoots(last,m),hit=parentStrike(last,m,g,parent);
 var sha=c.sha.map(function(n){return n.g+role(n.g);}).filter(function(x,i,a){return a.indexOf(x)===i;}).join('、');
 var shang=c.shang.length?'乙伤官':'伤官';
 var seal=sealWords(c);
 if(layer==='大运'){
  return {verdict:sha+'透出，主这步运。申中壬是长生中气，受牵不拔，比不得亥子。'+seal+'。'+shang+'可以制杀，也会生火再生土，制杀不专。',
   career:sha+'用伤官来制。制得不专。藏印能接杀，没透出，化杀只做了一部分。',
   wealth:'申中有长生比根，比不得亥子禄刃。'+sha+'克身，任财仍然紧。',
   maxim:'杀透出，藏印只接得住一部分。'};
 }
 if(layer==='流年')return yearRead(last,c,g,nodes,sha,shang,seal,roots);
 return monthRead(last,c,roots,hit,sha,shang,seal);
}
function yearRead(last,c,g,nodes,sha,shang,seal){
 var rg=role(last.g),comb=stemComb('流年',g,nodes),verdict,career,wealth,maxim;
 if(rg==='偏财'||rg==='正财'){
  verdict=last.g+rg+'透出有根，来生'+sha+'，也耗身、也制金。'+(comb?comb+'。':'')+'岁不占月令。';
  career='财生'+sha+'，杀更有依靠。'+seal+'。伤官仍可制杀，和财生杀不是一回事。';
  wealth=last.g+'这颗财透出，生财一头更明。身还没有亥子本气根，任财仍紧。';
  maxim='岁财生杀，月令未到。';
 }else if(rg==='七杀'){
  verdict=last.g+'七杀再透，与已有的'+sha+'同类。'+seal+'。岁不占月令。';
  career='杀加一重。'+shang+'制杀的局面还在，制得专不专要看火土是否通关。';
  wealth='杀克身，任财更紧。财星原局就有。';
  maxim='杀加重，印仍是藏着的那一层。';
 }else if(rg==='正官'){
  verdict=last.g+'正官透出。原局伤官这才碰到正官。'+sha+'仍是七杀，官和杀不是同一个。岁不占月令。';
  career='伤官见正官。'+shang+'能否压住这个官，并不因此说明七杀也被制住。';
  wealth='正官克身，任财受压。原局财星还在。';
  maxim='岁见正官，七杀还在运上。';
 }else if(rg==='偏印'||rg==='正印'){
  verdict=last.g+rg+'透出。'+seal+'。它来化'+sha+'，岁不占月令。';
  career='印来化杀。'+(c.path==='open'?'这条生身用得上，同时克伤官，制杀让位。':'被合或被财牵住，化杀做不满；伤官制杀也还留着。');
  wealth=c.path==='open'?'印生身，任财变松；印克伤官，生财变窄。':'印被牵住，生财没有被截断，身也还没得月令。';
  maxim=c.path==='open'?'印能生身，也克伤官。':'印透出，化杀未做满。';
 }else if(rg==='比肩'||rg==='劫财'){
  var idle=c.ben.filter(function(r){return r.z===last.z;});
  verdict=last.g+rg+'透出。'+(idle.length?idle.map(place).join('、')+'在岁支，帮身，不占月令。':'没有本气根，也不占月令。')+sha+'还在。';
  career='比劫不改'+sha+'。'+shang+'制杀仍是上一层的事。';
  wealth=idle.length?'岁支本气根让任财松一截，月令未到。':'比劫透出，任财没有新的本气根。';
  maxim='比劫帮身，杀还在运上。';
 }else{
  verdict=last.g+rg+'透出，泄身，也生财、也能制'+sha+'。岁不占月令。';
  career='伤食加力，制杀的一面更显，化杀仍看印。'+seal+'。';
  wealth='泄身生财更动。身的根没有因此变成禄刃。';
  maxim='伤食加力，印仍按藏透分寸看。';
 }
 return {verdict:verdict,career:career,wealth:wealth,maxim:maxim};
}
function monthRead(last,c,roots,hit,sha,shang,seal){

function go(date,v){if(D.days.every(function(d){return d.date!==date;}))throw Error('日期超出原离线范围');cur=date;$('pick').value=cur;if(v)view=v;render();}
$('pick').innerHTML=D.days.map(function(d){return '<option value="'+d.date+'">'+d.date+' 周'+d.weekday+' '+d.day_gz+'</option>';}).join('');
var today=E.stamp(now()).slice(0,10);cur=today<D.range[0]?D.range[0]:today>D.range[1]?D.range[1]:today;
$('clock').value=E.stamp(now()).slice(11,19);
if(cur!==today){$('notice').textContent='今天不在原版离线日期范围 '+D.range.join(' 至 ')+'（北京时间 UTC+8），已选最近日期；不会拿旧卡片冒充今天。';$('notice').style.display='block';}
$('bMonth').onclick=function(){view='month';render();};$('bToday').onclick=function(){view='day';render();};$('bBig').onclick=function(){view='big';render();};
$('pick').onchange=function(){go(this.value);};$('clock').onchange=function(){render();};
function move(n){var i=D.days.map(function(d){return d.date;}).indexOf(cur);if(D.days[i+n])go(D.days[i+n].date);}
$('prev').onclick=function(){move(-1);};$('next').onclick=function(){move(1);};
$('rules').innerHTML=rows([['历法',D.dateRule],['取舍',D.sourceNote],['推演边界','只辨出生月令、流月季令、本中余根气，以及财官杀印比食伤的路径。合冲不拔根，不打分，不把交错关系收成吉凶。不管人元司令分日，也不声称完成合化或全部成败。'],['调候','原局巳月燥热需要发源润燥，但流月寒暖可改变需求；本模型不自动断精细调候用量，不能把寒暖或金水数量直接当吉凶。'],['现实边界','只作传统文化反思框架，不是经科学验证的预测；执法、医疗、投资等行动以法律、专业规范和客观证据为准。'],['版本','由独立页 ZS-v3.2 演进到 V4.4。旧冻结日卡不参与判断。未改六爻、临阵或 Pages。']]);
var t=D.decision_template;$('decide').innerHTML='<b>'+esc(t.title)+'</b>'+list(t.questions)+'<p class="sub">仅保留事实审查问题；删除旧交易统计与分级日历。页面不保存个人输入，历史日期仍可从日期框查看；旧版也未提供记录保存功能。</p>';
go(cur,'month');
window.ZhishiApp={go:go,view:function(){return view;},cur:function(){return cur;},data:D,result:function(){return result;},brief:function(){return brief();},at:function(ms,withDay){return E.at(ms,D.terms,withDay);}};
})();
